name: Build & Deploy

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [rebuild-sitio] # disparado por la Edge Function programar-publicacion
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build Angular (estático)
        run: npm run build -- --configuration production

      - name: Inyectar SUPABASE_ANON_KEY en el bundle
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # environment.ts se compila con el placeholder '__SUPABASE_ANON_KEY__'
          # (clave PÚBLICA). Lo reemplazamos por el valor real del secreto en
          # los .js ya generados, sin recompilar.
          grep -rl '__SUPABASE_ANON_KEY__' dist/privas-magazine/browser --include='*.js' \
            | xargs -r sed -i "s|__SUPABASE_ANON_KEY__|${SUPABASE_ANON_KEY}|g"

      - name: Preparar salida prebuilt para Vercel
        run: |
          # 'outputPath' no está en angular.json → default dist/<project>/browser
          # (builder @angular/build:application). Copiamos ese contenido a la
          # estructura que espera 'vercel deploy --prebuilt'.
          mkdir -p .vercel/output/static
          cp -r dist/privas-magazine/browser/* .vercel/output/static/
          echo '{"version":3}' > .vercel/output/config.json

      - name: Instalar Vercel CLI
        run: npm i -g vercel@latest

      - name: Deploy a Vercel (usa .vercel/output ya compilado, sin recompilar)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # --prebuilt: Vercel sube tal cual .vercel/output/static, NO corre
          # 'vercel build' ni 'ng build'. El build de Angular ya corrió arriba.
          vercel deploy --prebuilt \
            --prod \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --yes
