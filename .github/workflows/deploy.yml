name: Build & Deploy

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [rebuild-sitio] # disparado por la Edge Function programar-publicacion
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests unitarios (issue #74)
        run: npm test -- --watch=false

      - name: Build Angular (estático)
        run: npm run build -- --configuration production

      - name: Inyectar SUPABASE_ANON_KEY en el bundle
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # environment.ts se compila con el placeholder '__SUPABASE_ANON_KEY__'
          # (clave PÚBLICA). Lo reemplazamos por el valor real del secreto en
          # los .js ya generados, sin recompilar.
          grep -rl '__SUPABASE_ANON_KEY__' dist/privas-magazine/browser --include='*.js' \
            | xargs -r sed -i "s|__SUPABASE_ANON_KEY__|${SUPABASE_ANON_KEY}|g"

      - name: Deploy a Akky por FTP
        # La cuenta FTP de Akky apunta DIRECTO a la raíz pública del dominio,
        # sin la carpeta public_html/ de la convención estándar de cPanel
        # (confirmado en vivo, issue #55/#19 — mismo criterio que
        # FTP_REMOTE_PREFIX vacío en subir-archivo/eliminar-archivo).
        # server-dir "/" es esa raíz. NUNCA borra archivos remotos que no
        # vengan del build (dangerous-clean-slate NO se activa) y además se
        # excluye explícitamente uploads/** — ahí vive lo que suben admins
        # desde el panel (subir-archivo), un deploy del sitio no debe tocarlo.
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Akky confirmó que no tiene SFTP. Igual que subir-archivo, se usa
          # FTPS explícito primero: el intento con 'ftp' plano dio
          # "530 Login authentication failed" en CI con las credenciales ya
          # verificadas — todo apunta a que el servidor exige TLS para
          # autenticar y subir-archivo solo funcionó porque su rama FTPS
          # (secure:true) fue la que realmente conectó.
          protocol: ftps
          local-dir: dist/privas-magazine/browser/
          server-dir: ./
          exclude: |
            **/uploads/**
            **/.well-known/**
