name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: xiqqhjdpmqdnzsvpjhwq
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
      # Los secretos de las funciones (FTP_*, RESEND_API_KEY, UPLOAD_TARGET,
      # GH_DISPATCH_TOKEN, GH_DISPATCH_REPO) se configuran una vez desde el
      # dashboard de Supabase o con `supabase secrets set` — ver docs/SECRETS.md.

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Smoke test de permisos contra lo recién desplegado (issue #74)
        # Pega en vivo a invitar-admin/set-admin-activo YA desplegadas —
        # confirma que siguen rechazando llamadas sin sesión (requireAdmin).
        # No necesita ninguna cuenta real, solo prueba el candado de acceso.
        run: deno test --allow-net supabase/functions/_tests/permisos.test.ts
