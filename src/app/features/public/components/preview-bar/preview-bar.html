@if (visible()) {
  <div class="pv" role="status">
    <span class="pv__estado">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="12" cy="12" r="3" />
      </svg>
      <span class="pv__texto">
        <strong>Modo vista previa</strong>
        <span class="pv__detalle">Ves el sitio como lo ve el público</span>
      </span>
    </span>
    <button type="button" class="pv__volver" (click)="volverAlPanel()">Volver al panel</button>
    <button type="button" class="pv__cerrar" (click)="ocultar()" aria-label="Salir del modo vista previa">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" /></svg>
    </button>
  </div>
}
