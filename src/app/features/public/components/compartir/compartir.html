<div class="cmp" [class.cmp--compacto]="compacto()">
  <button
    type="button"
    class="cmp__principal"
    (click)="compartir()"
    aria-haspopup="menu"
    [attr.aria-expanded]="menuAbierto()"
    [attr.aria-label]="compacto() ? 'Compartir' : null"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    @if (!compacto()) {
      <span>Compartir</span>
    }
  </button>

  @if (menuAbierto()) {
    <div class="cmp__menu" role="menu" aria-label="Compartir en">
      @for (e of enlaces(); track e.nombre) {
        <a class="cmp__item" role="menuitem" [href]="e.href" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="e.icono" /></svg>
          {{ e.nombre }}
        </a>
      }
      <button type="button" class="cmp__item" role="menuitem" (click)="copiar()">
        @if (copiado()) {
          <svg class="lin" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
          Enlace copiado
        } @else {
          <svg class="lin" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Copiar enlace
        }
      </button>
    </div>
  }
</div>
