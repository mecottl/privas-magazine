@if (edicion(); as e) {
  <a
    class="edicion-card__link"
    [class.edicion-card__link--titulo]="mostrarTitulo()"
    [href]="e.pdf_url"
    target="_blank"
    rel="noopener"
    [attr.aria-label]="'Ver PDF — ' + e.titulo"
  >
    <span class="edicion-card__marco">
      <img class="edicion-card__portada" [src]="e.portada_url" [alt]="'Portada — ' + e.titulo" loading="lazy" />
      @if (!mostrarTitulo()) {
        <span class="edicion-card__num">{{ sello() }}</span>
      }
    </span>
    <span class="edicion-card__pie">
      @if (mostrarTitulo()) {
        <span class="edicion-card__titulo">{{ e.titulo }}</span>
      }
      <span class="edicion-card__meta">
        <span class="edicion-card__label">{{ etiqueta() }}</span>
        <span class="edicion-card__cta">
          Ver PDF
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
      </span>
    </span>
  </a>
} @else {
  <div class="edicion-card__link edicion-card__link--proxima">
    <span class="edicion-card__marco edicion-card__marco--vacio">
      <span>Próximamente</span>
      @if (!mostrarTitulo()) {
        <span class="edicion-card__num">{{ sello() }}</span>
      }
    </span>
    <span class="edicion-card__pie">
      <span class="edicion-card__meta">
        <span class="edicion-card__label">{{ etiqueta() }}</span>
      </span>
    </span>
  </div>
}
