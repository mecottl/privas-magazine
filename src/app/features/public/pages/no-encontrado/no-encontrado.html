<section class="hero hero--seccion">
  <app-hero-media class="hero__media" nombre="cat-archivo" alt="" [prioridad]="true" />

  <div class="hero__inner">
    <span class="hero__eyebrow">Error 404</span>
    <h1 class="hero__title">Esta ruta no está en el mapa</h1>
    <p class="hero__texto">
      El enlace puede estar roto o el contenido se movió — pero la revista
      sigue completa. Elige por dónde seguir:
    </p>
    <div class="no-encontrado__acciones">
      <a routerLink="/" class="btn btn--crema">Ir al inicio</a>
      <a routerLink="/articulos" class="btn btn--fantasma">Ver los artículos</a>
      <a routerLink="/revistas" class="btn btn--fantasma">Ver las ediciones</a>
    </div>
  </div>
</section>
