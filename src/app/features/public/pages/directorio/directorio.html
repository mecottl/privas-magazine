<section class="hero hero--seccion">
  <app-hero-media class="hero__media" nombre="cat-entretenimiento" alt="" [prioridad]="true" />

  <div class="hero__inner">
    <span class="hero__eyebrow">El equipo</span>
    <h1 class="hero__title">Directorio</h1>
    <p class="hero__texto">Quiénes hacemos PRIVAS Magazine y cómo escribirle a cada área.</p>
  </div>
</section>

<section class="franja franja--fin">
  <div class="franja__wrap">
    <ul class="dir-lista">
      @for (m of directorio; track m.correo) {
        <li class="dir-item">
          <span class="dir-item__rol">{{ m.rol }}</span>
          @if (m.url) {
            <a class="dir-item__nombre" [href]="m.url" target="_blank" rel="noopener">{{ m.nombre }}</a>
          } @else {
            <span class="dir-item__nombre">{{ m.nombre }}</span>
          }
          <a class="dir-item__correo" [href]="'mailto:' + m.correo">{{ m.correo }}</a>
        </li>
      }
    </ul>
  </div>
</section>
