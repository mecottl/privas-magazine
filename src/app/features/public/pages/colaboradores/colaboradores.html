<section class="hero hero--seccion">
  <app-hero-media class="hero__media" nombre="cat-entretenimiento" alt="" [prioridad]="true" />

  <div class="hero__inner">
    <span class="hero__eyebrow">Gracias</span>
    <h1 class="hero__title">Colaboradores</h1>
    <p class="hero__texto">Quienes han escrito para PRIVAS Magazine.</p>
  </div>
</section>

<section class="franja franja--fin">
  <div class="franja__wrap col-wrap">
    @if (!cargando() && nombres().length) {
      <ul class="col-lista">
        @for (n of nombres(); track n) {
          <li>{{ n }}</li>
        }
      </ul>
    } @else if (!cargando()) {
      <p class="col-vacio">Todavía no hay colaboradores registrados en un artículo publicado.</p>
    }
  </div>
</section>
