<input
  #inp
  type="file"
  class="campo-archivo__input"
  [accept]="accept()"
  (change)="alCambiar($event)"
/>

@if (url()) {
  <div class="campo-archivo__hecho">
    @if (imagen()) {
      <img class="campo-archivo__prev" [src]="url()" alt="" />
    } @else {
      <span class="campo-archivo__doc" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M6 3h9l4 4v14H6z" stroke-linejoin="round" />
          <path d="M15 3v4h4M9 13h6M9 17h6" stroke-linecap="round" />
        </svg>
      </span>
    }
    <div class="campo-archivo__acciones">
      <span class="campo-archivo__ok">Cargado ✓</span>
      <a [href]="url()" target="_blank" rel="noopener">Ver</a>
      <button type="button" (click)="abrir()" [disabled]="subiendo()">
        {{ subiendo() ? 'Subiendo…' : 'Cambiar' }}
      </button>
    </div>
  </div>
} @else {
  <button type="button" class="campo-archivo__elegir" (click)="abrir()" [disabled]="subiendo()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
      <path d="M12 16V4M7 9l5-5 5 5M4 18v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    {{ subiendo() ? 'Subiendo…' : etiqueta() }}
  </button>
}
