<div class="login">
  <div class="login__panel">
    <a routerLink="/" class="login__marca" aria-label="PRIVAS Magazine — ir al sitio">
      <img src="/logo-privas.png" alt="PRIVAS Magazine" width="441" height="180" />
    </a>

    <section class="login__card">
      @if (siguiente()) {
        <h1 class="login__titulo">Confirma tu invitación</h1>
        <p class="login__sub">
          Ya casi — solo falta que confirmes con un clic para activar tu acceso.
        </p>
        <button type="button" class="login__enviar" (click)="continuar()">
          Continuar
        </button>
      } @else {
        <h1 class="login__titulo">Enlace incompleto</h1>
        <p class="login__sub">
          Este link no trae la información necesaria. Pide que te reenvíen la invitación desde el panel.
        </p>
        <a routerLink="/gestion-privas/login" class="login__volver">← Ir a iniciar sesión</a>
      }
    </section>

    <a routerLink="/" class="login__volver">← Volver al sitio</a>
  </div>
</div>
