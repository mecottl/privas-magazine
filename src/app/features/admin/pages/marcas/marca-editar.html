<div class="admin-page">
  <div class="admin-page-head">
    <div>
      <a routerLink=".." class="volver">← Marcas</a>
      <h1>{{ id ? 'Editar marca' : 'Nueva marca' }}</h1>
    </div>
  </div>

  <div class="admin-page__scroll">
    @if (error()) { <p class="error">{{ error() }}</p> }
    @if (ok()) { <p class="ok">{{ ok() }}</p> }

    <div class="mc-grid">
      <section class="panel mc-datos">
        <input
          class="mc-titulo"
          name="nombre"
          placeholder="Nombre de la marca"
          aria-label="Nombre de la marca"
          [(ngModel)]="m.nombre"
          required
        />

        <div class="campos-grid">
          <label class="mc-ancho">Sitio web propio (CTA)
            <input [(ngModel)]="m.sitio_web_url" name="web" placeholder="https://…" />
          </label>
          <label class="mc-ancho">Descripción
            <input [(ngModel)]="m.descripcion" name="desc" placeholder="Una línea sobre la marca (opcional)" />
          </label>
        </div>

        <p class="lado-titulo">Logo</p>
        <div class="mc-logo">
          <div class="mc-logo__subir">
            <app-campo-archivo
              [url]="m.logo_url || null"
              [imagen]="true"
              accept="image/*"
              etiqueta="Subir imagen"
              [subiendo]="subiendoLogo()"
              (elegido)="subirLogo($event)"
            />
            @if (m.logo_url) {
              <button type="button" class="secundario peligro mc-logo__quitar" (click)="quitarLogo()">
                Quitar logo
              </button>
            }
          </div>
        </div>

        <p class="lado-titulo">Redes sociales</p>
        @for (e of m.enlaces; track $index) {
          <div class="mc-enlace">
            <select [(ngModel)]="e.tipo" [name]="'tipo-' + $index" aria-label="Tipo de red">
              @for (t of tipos; track t) { <option [value]="t">{{ t }}</option> }
            </select>
            <input [(ngModel)]="e.url" [name]="'url-' + $index" [placeholder]="ph(e.tipo)" aria-label="URL de la red social" />
            <button type="button" class="secundario peligro" (click)="quitarEnlace($index)">Quitar</button>
          </div>
        } @empty {
          <p class="hint">Sin redes sociales.</p>
        }
        <button type="button" class="secundario" (click)="agregarEnlace()">+ Red social</button>
      </section>

      <aside class="mc-lado">
        <div class="panel">
          <p class="lado-titulo">Acciones</p>
          <div class="mc-acciones">
            <button type="button" (click)="guardar()" [disabled]="guardando()">
              {{ guardando() ? 'Guardando…' : (id ? 'Guardar cambios' : 'Crear marca') }}
            </button>
            @if (id) {
              <button type="button" class="secundario peligro" (click)="eliminar()">Eliminar</button>
            }
          </div>
        </div>
      </aside>
    </div>
  </div>
</div>
