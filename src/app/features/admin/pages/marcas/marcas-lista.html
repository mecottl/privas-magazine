<div class="admin-page">
  <div class="admin-page-head">
    <h1>Marcas</h1>
    <div class="admin-page-head__acciones">
      <a routerLink="nuevo"><button>Nueva marca</button></a>
    </div>
  </div>

  <div class="admin-page__fill">
    @if (error()) { <p class="error">{{ error() }}</p> }

    <div class="tabla-wrap">
      <table>
        <thead>
          <tr>
            <th>Nombre</th><th>Sitio web</th><th>Redes</th><th>Orden</th>
            <th class="col-acciones">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @if (cargando()) {
            <tr><td colspan="5"><div class="admin-cargando">Cargando…</div></td></tr>
          } @else {
            @for (m of marcas(); track m.id) {
              <tr>
                <td><a [routerLink]="[m.id]">{{ m.nombre }}</a></td>
                <td>{{ m.sitio_web_url || '—' }}</td>
                <td>{{ (m.enlaces?.length || 0) }}</td>
                <td>{{ m.orden }}</td>
                <td class="col-acciones">
                  <div class="acciones">
                    <a [routerLink]="[m.id]"><button class="secundario">Editar</button></a>
                    <button class="secundario peligro" (click)="eliminar(m)">Eliminar</button>
                  </div>
                </td>
              </tr>
            } @empty {
              <tr><td colspan="5"><div class="admin-empty">Sin marcas.</div></td></tr>
            }
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
